openapi: 3.0.3
info:
  title: Lumière E-Commerce API
  description: >
    OpenAPI specification for the Lumière e-commerce store (Next.js App Router API).
    Enables AI discovery, search, and recommendations via Navi AI Commerce.

    Authentication: protected endpoints accept either a NextAuth session cookie
    (next-auth.session-token) or a bearer JWT obtained from POST /api/auth/login
    (JSON, returns a signed JWT with expiry). Cookie login is performed via
    POST /api/auth/callback/credentials (form-encoded, no JSON token is returned).
    Admin management (users, orders, coupons, inventory) is implemented server-side
    and has no REST endpoints.
  version: 1.0.0
  license:
    name: Proprietary
servers:
  - url: https://lumie-commerce.vercel.app
security: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    CookieAuth:
      type: apiKey
      in: cookie
      name: next-auth.session-token
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        details:
          type: object
          additionalProperties: true
        code:
          type: string
    MessageResponse:
      type: object
      properties:
        message:
          type: string
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
    Meta:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
    Role:
      type: string
      enum:
        - USER
        - ADMIN
        - SELLER
    Gender:
      type: string
      enum:
        - MALE
        - FEMALE
    AuthUser:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          nullable: true
        email:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        avatar:
          type: string
          nullable: true
        emailVerified:
          type: string
          format: date-time
          nullable: true
    LoginResponse:
      type: object
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/AuthUser"
    ProductImage:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
        alt:
          type: string
          nullable: true
    ProductCategory:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
    ProductListItem:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        price:
          type: number
        comparePrice:
          type: number
          nullable: true
        stock:
          type: integer
        isFeatured:
          type: boolean
        images:
          type: array
          items:
            $ref: "#/components/schemas/ProductImage"
        category:
          $ref: "#/components/schemas/ProductCategory"
        avgRating:
          type: number
        reviewCount:
          type: integer
    ProductDetail:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        price:
          type: number
        comparePrice:
          type: number
          nullable: true
        stock:
          type: integer
        sku:
          type: string
          nullable: true
        isFeatured:
          type: boolean
        isPublished:
          type: boolean
        avgRating:
          type: number
        reviewCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        images:
          type: array
          items:
            $ref: "#/components/schemas/ProductImage"
        category:
          $ref: "#/components/schemas/ProductCategory"
    PaginatedProducts:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProductListItem"
        meta:
          $ref: "#/components/schemas/Meta"
    CategoryWithChildren:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        image:
          type: string
          nullable: true
        parentId:
          type: string
          nullable: true
        children:
          type: array
          items:
            $ref: "#/components/schemas/CategoryWithChildren"
    CategoryList:
      type: array
      items:
        $ref: "#/components/schemas/CategoryWithChildren"
    ReviewUser:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          nullable: true
    ReviewReply:
      type: object
      properties:
        id:
          type: string
        comment:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/ReviewUser"
    Review:
      type: object
      properties:
        id:
          type: string
        rating:
          type: number
        comment:
          type: string
        isVerifiedPurchase:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/ReviewUser"
        replies:
          type: array
          items:
            $ref: "#/components/schemas/ReviewReply"
    ReviewsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Review"
        meta:
          $ref: "#/components/schemas/Meta"
        summary:
          type: object
          properties:
            avgRating:
              type: number
            reviewCount:
              type: integer
    ReviewCreatedResponse:
      type: object
      properties:
        message:
          type: string
        review:
          $ref: "#/components/schemas/Review"
    ReplyCreatedResponse:
      type: object
      properties:
        message:
          type: string
        reply:
          $ref: "#/components/schemas/ReviewReply"
    CartProduct:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        price:
          type: number
        stock:
          type: integer
        image:
          type: object
          nullable: true
          properties:
            url:
              type: string
            alt:
              type: string
              nullable: true
    CartItem:
      type: object
      properties:
        id:
          type: string
        productId:
          type: string
        quantity:
          type: integer
        lineTotal:
          type: number
        product:
          $ref: "#/components/schemas/CartProduct"
    Cart:
      type: object
      properties:
        id:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        subtotal:
          type: number
        itemCount:
          type: integer
    CheckoutAddressInput:
      type: object
      required:
        - fullName
        - phone
        - country
        - city
        - street
      properties:
        fullName:
          type: string
        phone:
          type: string
        country:
          type: string
        city:
          type: string
        street:
          type: string
        postalCode:
          type: string
          nullable: true
    CheckoutInput:
      type: object
      required:
        - provider
        - shippingAddress
      properties:
        provider:
          type: string
          enum:
            - stripe
            - paypal
            - cod
        shippingAddress:
          $ref: "#/components/schemas/CheckoutAddressInput"
        promoCode:
          type: string
          nullable: true
        guestEmail:
          type: string
          nullable: true
    CheckoutStripe:
      type: object
      properties:
        clientSecret:
          type: string
    CheckoutPaypal:
      type: object
      properties:
        orderId:
          type: string
    CheckoutResult:
      type: object
      properties:
        orderId:
          type: string
        provider:
          type: string
          enum:
            - stripe
            - paypal
            - cod
        status:
          type: string
          enum:
            - pending
        amount:
          type: number
        currency:
          type: string
        stripe:
          $ref: "#/components/schemas/CheckoutStripe"
        paypal:
          $ref: "#/components/schemas/CheckoutPaypal"
    OrderStatus:
      type: string
      enum:
        - PENDING
        - PAID
        - SHIPPED
        - DELIVERED
        - CANCELLED
        - RETURNED
        - FAILED
        - PROCESSING
    PaymentStatus:
      type: string
      enum:
        - PENDING
        - SUCCESS
        - FAILED
    OrderListItem:
      type: object
      properties:
        id:
          type: string
        status:
          $ref: "#/components/schemas/OrderStatus"
        totalAmount:
          type: number
        currency:
          type: string
        itemCount:
          type: integer
        createdAt:
          type: string
          format: date-time
    OrderItem:
      type: object
      properties:
        id:
          type: string
        productId:
          type: string
        productName:
          type: string
        productSlug:
          type: string
        imageUrl:
          type: string
          nullable: true
        quantity:
          type: integer
        price:
          type: number
        lineTotal:
          type: number
    OrderPayment:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/PaymentStatus"
        provider:
          type: string
        transactionId:
          type: string
          nullable: true
    OrderShippingAddress:
      type: object
      properties:
        fullName:
          type: string
        phone:
          type: string
        country:
          type: string
        city:
          type: string
        street:
          type: string
        postalCode:
          type: string
          nullable: true
    OrderDetail:
      type: object
      properties:
        id:
          type: string
        status:
          $ref: "#/components/schemas/OrderStatus"
        subtotal:
          type: number
        discountAmount:
          type: number
        promoCode:
          type: string
          nullable: true
        taxAmount:
          type: number
        shippingFee:
          type: number
        totalAmount:
          type: number
        currency:
          type: string
        itemCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        payment:
          $ref: "#/components/schemas/OrderPayment"
        shippingAddress:
          $ref: "#/components/schemas/OrderShippingAddress"
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
    PaginatedOrders:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/OrderListItem"
        meta:
          $ref: "#/components/schemas/Meta"
    InvoiceFile:
      type: string
      format: binary
    DiscountType:
      type: string
      enum:
        - PERCENTAGE
        - FIXED
    PromoValidation:
      type: object
      properties:
        code:
          type: string
        discountType:
          $ref: "#/components/schemas/DiscountType"
        discountValue:
          type: number
    Address:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        fullName:
          type: string
        phone:
          type: string
        city:
          type: string
        country:
          type: string
        street:
          type: string
        postalCode:
          type: string
          nullable: true
        isDefault:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AddressList:
      type: array
      items:
        $ref: "#/components/schemas/Address"
    AddressInput:
      type: object
      required:
        - fullName
        - phone
        - country
        - city
        - street
      properties:
        fullName:
          type: string
        phone:
          type: string
        country:
          type: string
        city:
          type: string
        street:
          type: string
        postalCode:
          type: string
          nullable: true
        isDefault:
          type: boolean
    AddressUpdateInput:
      type: object
      properties:
        fullName:
          type: string
        phone:
          type: string
        country:
          type: string
        city:
          type: string
        street:
          type: string
        postalCode:
          type: string
          nullable: true
        isDefault:
          type: boolean
    UserProfile:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          nullable: true
        email:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        avatar:
          type: string
          nullable: true
        emailVerified:
          type: string
          format: date-time
          nullable: true
        birthDate:
          type: string
          format: date-time
          nullable: true
        gender:
          $ref: "#/components/schemas/Gender"
        phone:
          type: string
          nullable: true
        isRestricted:
          type: boolean
        deletedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        addresses:
          type: array
          items:
            $ref: "#/components/schemas/Address"
    UpdateProfileInput:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
    UpdatePasswordInput:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
    WishlistProductIds:
      type: object
      properties:
        productIds:
          type: array
          items:
            type: string
    WishlistToggleResult:
      type: object
      properties:
        status:
          type: string
          enum:
            - added
            - removed
    SellerProfile:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        shopName:
          type: string
        description:
          type: string
          nullable: true
        logoUrl:
          type: string
          nullable: true
        isApproved:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SellerRegisterResponse:
      type: object
      properties:
        message:
          type: string
        profile:
          $ref: "#/components/schemas/SellerProfile"
    RecentProduct:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        price:
          type: number
        comparePrice:
          type: number
          nullable: true
        stock:
          type: integer
        sku:
          type: string
          nullable: true
        isFeatured:
          type: boolean
        isPublished:
          type: boolean
        avgRating:
          type: number
        reviewCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        images:
          type: array
          items:
            $ref: "#/components/schemas/ProductImage"
    RecentProductList:
      type: array
      items:
        $ref: "#/components/schemas/RecentProduct"
    WebhookAck:
      type: object
      properties:
        received:
          type: boolean
paths:
  /api/auth/login:
    post:
      summary: Log in with email and password, receive a bearer JWT
      description: >
        JSON POST. On success returns a signed HS256 JWT (expires in 1 day, or 30 days
        with rememberMe: true) plus the token expiry timestamp and the user record.
        Use the token as Authorization: Bearer <token> for protected endpoints.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                password:
                  type: string
                rememberMe:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Login successful, JWT issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Email not verified, account deleted, or account restricted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/register:
    post:
      summary: Register a new user (USER or SELLER)
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
                - confirmPassword
                - birthDate
                - gender
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
                  minLength: 8
                confirmPassword:
                  type: string
                birthDate:
                  type: string
                  format: date-time
                gender:
                  $ref: "#/components/schemas/Gender"
                role:
                  $ref: "#/components/schemas/Role"
                shopName:
                  type: string
      responses:
        "201":
          description: Account created (email verification required before login)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: "#/components/schemas/AuthUser"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/callback/credentials:
    post:
      summary: Log in with email and password (NextAuth credentials flow)
      description: >
        Form-encoded POST. On success the server responds with a 302 redirect and
        sets the next-auth.session-token cookie. No JSON token is returned by this API.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - email
                - password
                - csrfToken
              properties:
                email:
                  type: string
                password:
                  type: string
                csrfToken:
                  type: string
                callbackUrl:
                  type: string
                rememberMe:
                  type: string
      responses:
        "200":
          description: >
            Login successful (the client follows the redirect and the session token is
            stored in the next-auth.session-token cookie). Response body is empty.
          content:
            application/json:
              schema:
                type: object
        "302":
          description: Login success. Session established via next-auth.session-token cookie.
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/forgot-password:
    post:
      summary: Request a password reset link
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
      responses:
        "200":
          description: Reset link sent if the account exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/reset-password:
    post:
      summary: Reset a password using the token from the reset email
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - password
                - confirmPassword
              properties:
                token:
                  type: string
                password:
                  type: string
                confirmPassword:
                  type: string
      responses:
        "200":
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/verify-email:
    post:
      summary: Verify a user's email address with the token from the verification email
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
      responses:
        "200":
          description: Email verified successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/resend-verification:
    post:
      summary: Resend the email verification message
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
      responses:
        "200":
          description: Verification email resent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Email is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/products:
    get:
      summary: List published products with stock, paginated
      description: Envelope is { data, meta }. Only products that are published and in stock are returned.
      tags:
        - Products
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: categorySlug
          in: query
          required: false
          schema:
            type: string
        - name: minPrice
          in: query
          required: false
          schema:
            type: number
        - name: maxPrice
          in: query
          required: false
          schema:
            type: number
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - price_asc
              - price_desc
              - newest
              - rating
            default: newest
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 12
      responses:
        "200":
          description: Paginated product list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedProducts"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/products/{slug}:
    get:
      summary: Get a single product by slug
      tags:
        - Products
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/products/{slug}/reviews:
    get:
      summary: List reviews for a product, paginated
      tags:
        - Reviews
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - newest
              - highest
            default: newest
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: Paginated reviews with rating summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewsResponse"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/categories:
    get:
      summary: List the category tree (root categories with nested children)
      description: Returns a bare array of root categories, each with nested children. Not paginated.
      tags:
        - Categories
